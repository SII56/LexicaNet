<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LexicaNet · Collection</title>
  <link rel="stylesheet" href="popup.css">
  <!-- Shared appearance preference is loaded before the page controller. -->
  <script src="theme.js"></script>
</head>
<body>
  <!-- Shared brand; the inline SVG inherits the active theme color. -->
  <nav class="brand-row" aria-label="Navigation">
    <div class="brand-lockup">
        <svg class="brand-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
        <g stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M29 8 7 44 46 53 53 28 29 8 46 53"/>
        <path d="M7 44 53 28" stroke-dasharray="3.2 2.4"/>
        </g>
        <g fill="currentColor">
        <circle cx="29" cy="8" r="4.4"/>
        <circle cx="7" cy="44" r="4.5"/>
        <circle cx="53" cy="28" r="4.3"/>
        <circle cx="46" cy="53" r="5.4"/>
        </g>
        </svg>
      <h2>LexicaNet<span class="brand-dot">.</span></h2>
    </div>
    <div class="top-actions">
      <span class="pending-badge"><span id="pendingCount">0</span> PENDING</span>
      <button id="openSettings" class="nav-button" aria-label="Open settings">Settings ↗</button>
    </div>
  </nav>

  <!-- Generation only creates a pending draft; it never submits automatically. -->
  <div class="label">Generate</div>
  <div class="row search-row">
    <input id="wordInput" type="text" placeholder="Collect a new word…" aria-label="Target word">
    <button id="generate" class="secondary">Generate +</button>
  </div>

  <div class="divider"></div>

  <!-- popup.js renders pending:* storage records into this list. -->
  <div class="label">Your collection</div>
  <div id="pendingList" aria-label="Pending cards"></div>

  <!-- The editable form is created when a pending card is selected. -->
  <div class="label">Card Preview</div>
  <div id="preview" class="preview">
    <div class="placeholder">Select a pending card to edit.</div>
  </div>

  <button id="addToAnki" disabled>Submit to Anki ↗</button>
  <div class="utility-actions">
    <button id="savePreview" class="secondary" disabled>Save changes</button>
    <button id="copy" class="secondary">Copy TSV</button>
    <button id="removePending" class="secondary" disabled>Remove</button>
  </div>

  <div id="status" role="status" aria-live="polite"></div>

  <!-- This controller only accesses elements belonging to the collection page. -->
  <script src="popup.js"></script>
</body>
</html>
