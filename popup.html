<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 380px;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      color: #1d1d1f;
      background: #fff;
      font-size: 14px;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 18px;
      font-weight: 650;
    }

    .label {
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }

    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
    }

    input, textarea {
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      padding: 9px 10px;
      outline: none;
      background: #fff;
    }

    input:focus, textarea:focus {
      border-color: #007aff;
    }

    textarea {
      height: 150px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre;
      line-height: 1.45;
    }

    button {
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      padding: 9px 10px;
      background: #007aff;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    button.secondary {
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .row button {
      margin-top: 0;
      flex: 1;
    }

    .check {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #333;
    }

    .check input {
      width: auto;
    }

    #status {
      margin-top: 12px;
      color: #6e6e73;
      min-height: 18px;
      font-size: 13px;
    }

    .divider {
      height: 1px;
      background: #e5e5ea;
      margin: 16px 0;
    }

    input, textarea, button, select {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
    }

    select {    
    margin-top: 8px;
    border: 1px solid #d2d2d7;
    border-radius: 8px;
    padding: 9px 10px;
    background: #fff;
    }

    .preview {
      margin-top: 8px;
      border: 1px solid #e5e5ea;
      border-radius: 10px;
      padding: 18px;
      background: #fff;
      min-height: 140px;
    }

    .placeholder {
      color: #8e8e93;
    }

    .preview-word {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 16px;
    }

    .preview-label {
      font-size: 15px;
      font-weight: 600;
      margin-top: 14px;
      margin-bottom: 4px;
    }

    .preview-definition {
      color: #555;
      line-height: 1.5;
    }

    .preview-core {
      font-size: 20px;
      font-weight: 600;
    }

    .preview-associations {
      white-space: pre-line;
      line-height: 1.45;
      color: #222;
    }

    .preview hr {
      border: none;
      border-top: 1px solid #e5e5ea;
      margin: 16px 0;
    }
  </style>
</head>

<body>
  <h2>Lexical Network</h2>

  <div class="label">DeepSeek API Key</div>
  <input id="apiKey" type="password" placeholder="sk-..." />
  <div class="row">
    <button id="save" class="secondary">Save</button>
    <button id="test" class="secondary">Test Connection</button>
  </div>

  <div class="divider"></div>

  <div class="label">Generate</div>
  <input id="wordInput" type="text" placeholder="e.g. concept" />
  <button id="generate">Generate</button>

  <div class="label">Anki Target</div>

<div class="row">
  <button id="loadAnki" class="secondary">Load Anki</button>
</div>

<select id="deckSelect"></select>
<select id="modelSelect"></select>
  <label class="check">
    <input id="autoAddAnki" type="checkbox">
    Auto add to Anki
  </label>

  <div class="divider"></div>

  <!-- Card Preview -->
  <div class="label">Card Preview</div>
  <div id="preview" class="preview">
    <div class="placeholder">No card generated yet.</div>
  </div>
  <button id="copy" class="secondary">Copy TSV</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
